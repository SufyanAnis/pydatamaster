# Render Blueprint - https://render.com/docs/blueprint-spec
# Persistent disks need a paid instance type (Starter or above). On the free tier the
# SQLite database resets on every deploy, so use a paid plan for real data.
services:
  - type: web
    name: pydatamaster
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: pydatamaster-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/pydatamaster.db
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@pydatamaster.io
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
