# Self-hosting on any VPS with Docker:  docker compose up -d --build
services:
  pydatamaster:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_PATH=/data/pydatamaster.db
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@pydatamaster.io}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@12345}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - pdm_data:/data
    restart: unless-stopped

volumes:
  pdm_data:
