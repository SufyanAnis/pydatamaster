# Fly.io config - https://fly.io/docs/reference/configuration/
# First run:  fly launch --copy-config --no-deploy   then   fly volumes create pdm_data --size 1   then   fly deploy
app = "pydatamaster"
primary_region = "fra"

[build]

[env]
  PORT = "4000"
  DB_PATH = "/data/pydatamaster.db"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[mounts]
  source = "pdm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
